[package]
name = "cosmic-status-hub"
version = "1.0.2"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-only"
description = "An independent StatusNotifierHost tray applet for the COSMIC desktop"
repository = "https://github.com/marcelogomes90/cosmic-ext-applet-status-hub"
homepage = "https://github.com/marcelogomes90/cosmic-ext-applet-status-hub"
readme = "README.md"

[lib]
name = "cosmic_status_hub"
path = "src/lib.rs"

[[bin]]
name = "cosmic-status-hub"
path = "src/main.rs"

[[bin]]
name = "cosmic-status-hub-dump"
path = "src/bin/tray_dump.rs"

[features]
testkit = []

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"

[dependencies]
futures = "0.3"
cosmic-freedesktop-icons = { git = "https://github.com/pop-os/freedesktop-icons" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5.14", default-features = false, features = ["tokio"] }

# Do not pin a `rev` here. cosmic-panel-config depends on cosmic-config through the
# bare libcosmic URL, and a `rev` makes that a second, distinct Cargo source for the
# same repository. flatpak-cargo-generator emits only one source replacement per URL,
# so the offline Flatpak build then fails to resolve the unpinned copy.
# Cargo.lock still pins the exact commit, so builds stay reproducible.
[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = [
    "applet",
    "applet-token",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
]

[dev-dependencies]
cosmic-status-hub = { path = ".", features = ["testkit"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }

[profile.release]
lto = "thin"
opt-level = 2

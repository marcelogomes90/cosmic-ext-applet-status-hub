[package]
name = "cosmic-status-hub"
version = "1.5.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-only"
description = "An independent StatusNotifierHost tray applet for the COSMIC desktop"
repository = "https://github.com/marcelogomes90/cosmic-ext-applet-status-hub"
homepage = "https://github.com/marcelogomes90/cosmic-ext-applet-status-hub"
readme = "README.md"

[lib]
name = "cosmic_status_hub"
path = "src/lib.rs"

[[bin]]
name = "cosmic-status-hub"
path = "src/main.rs"

[[bin]]
name = "cosmic-status-hub-dump"
path = "src/bin/tray_dump.rs"

[features]
testkit = []

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"

[dependencies]
futures = "0.3"
cosmic-freedesktop-icons = { git = "https://github.com/pop-os/freedesktop-icons" }
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = { version = "0.45", default-features = false }
i18n-embed-fl = "0.10"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5.14", default-features = false, features = ["tokio"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = [
    "applet",
    "applet-token",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
]

[dev-dependencies]
cosmic-status-hub = { path = ".", features = ["testkit"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }

[profile.release]
lto = "thin"
opt-level = 2
